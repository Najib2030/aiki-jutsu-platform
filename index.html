<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon & icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA theme color -->
    <meta name="theme-color" content="#8b2c24" />
    <meta name="msapplication-TileColor" content="#8b2c24" />

    <!-- iOS-specific PWA tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aiki Jutsu" />

    <title>Aiki Jutsu — Digital Dojo</title>

    <!-- ★ Startup splash styles (inline, so they render before any CSS loads) -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 40%, rgba(192, 160, 98, 0.12), transparent 60%),
          #f4f1ea;
        transition: opacity 0.45s ease;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #app-splash.is-leaving { opacity: 0; pointer-events: none; }

      #app-splash svg {
        margin: 45px;
        width: 130px;
        height: 130px;
        overflow: visible;
      }

      #app-splash .ring {
        stroke: #c0a062;
        stroke-width: 1.2;
        fill: none;
        opacity: 0.15;
        animation: splashRingPulse 2s ease-in-out infinite;
        transform-origin: 50px 50px;
      }
      @keyframes splashRingPulse {
        0%, 100% { opacity: 0.08; stroke-width: 1; }
        50%      { opacity: 0.32; stroke-width: 2; }
      }

      #app-splash .left-katana {
        transform-origin: 14px 68px;
        animation: splashSwingL 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
      }
      #app-splash .right-katana {
        transform-origin: 86px 68px;
        animation: splashSwingR 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
      }
      @keyframes splashSwingL {
        0%   { transform: rotate(-50deg); }
        28%  { transform: rotate(50deg); }
        33%  { transform: rotate(45deg); }
        40%  { transform: rotate(50deg); }
        55%  { transform: rotate(50deg); }
        80%  { transform: rotate(-50deg); }
        100% { transform: rotate(-50deg); }
      }
      @keyframes splashSwingR {
        0%   { transform: rotate(50deg); }
        28%  { transform: rotate(-50deg); }
        33%  { transform: rotate(-45deg); }
        40%  { transform: rotate(-50deg); }
        55%  { transform: rotate(-50deg); }
        80%  { transform: rotate(50deg); }
        100% { transform: rotate(50deg); }
      }

      #app-splash .spark {
        opacity: 0;
        transform-origin: 50px 46px;
        animation: splashSpark 2s ease-out infinite;
      }
      @keyframes splashSpark {
        0%, 26% { opacity: 0; transform: scale(0.2); }
        29%     { opacity: 1; transform: scale(1.6); }
        35%     { opacity: 0.9; transform: scale(1.2); }
        48%     { opacity: 0; transform: scale(0.6); }
        100%    { opacity: 0; transform: scale(0.2); }
      }

      #app-splash .dots {
        display: flex;
        gap: 9px;
      }
      #app-splash .dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c0a062;
        animation: splashDot 1.4s infinite ease-in-out both;
        box-shadow: 0 2px 4px rgba(139,44,36,0.15);
      }
      #app-splash .dots span:nth-child(1) { animation-delay: -0.32s; }
      #app-splash .dots span:nth-child(2) { animation-delay: -0.16s; }
      #app-splash .dots span:nth-child(3) { animation-delay: 0s; }
      @keyframes splashDot {
        0%, 80%, 100% { transform: translateY(0) scale(0.7); opacity: 0.4; }
        40%           { transform: translateY(-10px) scale(1); opacity: 1; }
      }

      #app-splash .brand {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.4rem;
        letter-spacing: 4px;
        color: #8b2c24;
        font-weight: bold;
        margin-top: 18px;
      }
      #app-splash .brand-jp {
        font-size: 1.85rem;
        letter-spacing: 6px;
        color: #c0a062;
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .left-katana,
        #app-splash .right-katana,
        #app-splash .spark,
        #app-splash .ring,
        #app-splash .dots span { animation: none; }
        #app-splash .left-katana  { transform: rotate(50deg); }
        #app-splash .right-katana { transform: rotate(-50deg); }
      }
    </style>
  </head>
  <body>
    <!-- ★ Startup splash (self-contained, shown instantly) -->
    <div id="app-splash" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="splashBlade" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#5c4a2a"/>
            <stop offset="30%"  stop-color="#a8894a"/>
            <stop offset="55%"  stop-color="#e8d5b7"/>
            <stop offset="75%"  stop-color="#fbf3da"/>
            <stop offset="100%" stop-color="#c0a062"/>
          </linearGradient>
          <linearGradient id="splashTsuba" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e8d5b7"/>
            <stop offset="50%"  stop-color="#c0a062"/>
            <stop offset="100%" stop-color="#8a6e3a"/>
          </linearGradient>
          <linearGradient id="splashKashira" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#fbf3da"/>
            <stop offset="60%"  stop-color="#c0a062"/>
            <stop offset="100%" stop-color="#6d5528"/>
          </linearGradient>
          <radialGradient id="splashSpark" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#ffffff"/>
            <stop offset="25%"  stop-color="#fff8e1"/>
            <stop offset="55%"  stop-color="#f1c40f"/>
            <stop offset="100%" stop-color="rgba(192,160,98,0)"/>
          </radialGradient>

          <g id="splashKatana">
            <path d="M 46.5 46 C 46.8 36, 47.5 26, 48.8 17 Q 49.8 11, 51 7.5 L 52 5 L 53.4 7.5 Q 52.4 12.5, 51.4 18 C 50.2 27, 49.5 36, 49.3 46 Z" fill="url(#splashBlade)"/>
            <path d="M 51 7.5 L 52 5 L 53.4 7.5 Q 52.4 10.5, 51.6 12.5 Z" fill="#8a6e3a" opacity="0.35"/>
            <path d="M 49.3 46 C 49.5 36, 50.2 27, 51.4 18 Q 52.4 12.5, 53.4 7.5" stroke="#fbf3da" stroke-width="0.55" fill="none" opacity="0.92" stroke-linecap="round"/>
            <path d="M 47.3 46 C 47.6 36, 48.2 26, 49.5 17 Q 50.3 12, 51.2 8" stroke="#6d5528" stroke-width="0.35" fill="none" opacity="0.65"/>
            <rect x="45" y="45.5" width="10" height="2.2" rx="0.4" fill="#c0a062"/>
            <rect x="45" y="45.5" width="10" height="0.8" fill="#fbf3da" opacity="0.45"/>
            <ellipse cx="50" cy="49.2" rx="8.5" ry="2.4" fill="#1a1a1a"/>
            <ellipse cx="50" cy="49.2" rx="7.6" ry="2" fill="#2c1810"/>
            <ellipse cx="50" cy="49.2" rx="6.2" ry="1.4" fill="url(#splashTsuba)"/>
            <ellipse cx="50" cy="49.2" rx="1.1" ry="0.5" fill="#1a0e0a"/>
            <rect x="46" y="51.5" width="8" height="15.5" rx="0.4" fill="#1a0e0a"/>
            <path d="M 46 53.5 L 54 55 M 54 53.5 L 46 55" stroke="#8b2c24" stroke-width="0.95" fill="none" stroke-linecap="round"/>
            <path d="M 46 56.5 L 54 58 M 54 56.5 L 46 58" stroke="#8b2c24" stroke-width="0.95" fill="none" stroke-linecap="round"/>
            <path d="M 46 59.5 L 54 61 M 54 59.5 L 46 61" stroke="#8b2c24" stroke-width="0.95" fill="none" stroke-linecap="round"/>
            <path d="M 46 62.5 L 54 64 M 54 62.5 L 46 64" stroke="#8b2c24" stroke-width="0.95" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="54.2" r="0.35" fill="#e8d5b7" opacity="0.9"/>
            <circle cx="50" cy="57.2" r="0.35" fill="#e8d5b7" opacity="0.9"/>
            <circle cx="50" cy="60.2" r="0.35" fill="#e8d5b7" opacity="0.9"/>
            <circle cx="50" cy="63.2" r="0.35" fill="#e8d5b7" opacity="0.9"/>
            <path d="M 46 67 L 54 67 L 54 68.6 Q 54 69.6 53 69.6 L 47 69.6 Q 46 69.6 46 68.6 Z" fill="url(#splashKashira)"/>
            <path d="M 46 67 L 54 67 L 54 67.7 L 46 67.7 Z" fill="#fbf3da" opacity="0.55"/>
          </g>
        </defs>

        <circle cx="50" cy="50" r="55" class="ring"/>
        
        <!-- Left Katana -->
        <g class="left-katana">
          <g transform="translate(14, 0) scale(-1, 1) translate(-50, 0)">
            <use href="#splashKatana"/>
          </g>
        </g>
        
        <!-- Right Katana -->
        <g class="right-katana">
          <g transform="translate(86, 0) translate(-50, 0)">
            <use href="#splashKatana"/>
          </g>
        </g>
        
        <!-- Spark -->
        <circle cx="50" cy="46" r="13" fill="url(#splashSpark)" class="spark"/>
      </svg>

      <div class="dots"><span></span><span></span><span></span></div>
      <div class="brand">AIKI JUTSU</div>
      <div class="brand-jp">合気術</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
